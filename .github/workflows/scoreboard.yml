name: Scoreboard

on:
  workflow_dispatch:
  schedule:
    - cron: "18 2 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate top languages
        env:
          GITHUB_TOKEN: ${{ secrets.SCOREBOARD_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_USER: arookieofc
          OUTPUT_PATH: assets/top-languages.svg
        run: python scripts/generate_top_languages.py

      - name: Generate scoreboard
        env:
          GITHUB_TOKEN: ${{ secrets.SCOREBOARD_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_USER: arookieofc
          GITHUB_ORGS: ""
          OUTPUT_PATH: assets/scoreboard.svg
        run: python scripts/generate_scoreboard.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/scoreboard.svg assets/top-languages.svg
          git diff --cached --quiet || git commit -m "Update scoreboard [skip ci]"
          git push
